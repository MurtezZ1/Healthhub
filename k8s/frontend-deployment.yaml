apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthhub-client-deployment
  namespace: healthhub-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthhub-client
  template:
    metadata:
      labels:
        app: healthhub-client
    spec:
      containers:
      - name: healthhub-client
        image: healthhub-client:latest
        imagePullPolicy: Never # Use local docker image
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: healthhub-client
  namespace: healthhub-namespace
spec:
  selector:
    app: healthhub-client
  ports:
    - protocol: TCP
      port: 5173
      targetPort: 80
  type: LoadBalancer
